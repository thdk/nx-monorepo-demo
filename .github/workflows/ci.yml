name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  pull-requests: write # Passed through to cd.yml, which posts Terraform plan comments on PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_VERBOSE_LOGGING: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version-commit-sha: ${{ steps.publish.outputs.version-commit-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0
          ref: ${{ github.head_ref }}

      - name: Setup git
        id: git
        uses: ./.github/actions/setup-git

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - name: Setup node, install dependencies and configure nx
        uses: ./.github/actions/nx-setup-node

      - name: Format check
        run: pnpm exec nx format:check

      - name: Sync check
        run: pnpm exec nx sync:check

      - name: Lint package configurations
        run: pnpm exec nx syncpack

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected

      - name: Build lint test affected projects and prepare apps for containerization
        run: pnpm exec nx affected --targets lint test build

      - name: Version
        run: |
          if [ "${{ steps.git.outputs.branch-name }}" == "main" ]; then
            pnpm exec nx release \
              --groups packages,apps \
              --dockerVersionScheme production \
              --skip-publish
          else
            pnpm exec nx release \
              --preid pr-${{ steps.git.outputs.commit-sha-short }} \
              --groups packages,apps \
              --dockerVersionScheme production \
              --skip-publish
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate GCP
        uses: './.github/actions/authenticate-gcp'

      - name: Publish
        id: publish
        run: |
          if [ "${{ steps.git.outputs.branch-name }}" == "main" ]; then
            pnpm exec nx release publish \
              --groups packages,apps \
              --tag latest

            git push --follow-tags
            echo "version-commit-sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            pnpm exec nx release publish \
              --groups packages,apps \
              --tag pr-${{ steps.git.outputs.commit-sha-short }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # e2e runs in parallel with build. Splitting it out means a flaky e2e retry
  # re-runs only this job, not the build/version/publish work, and shortens
  # wall-clock. Playwright is only installed when an e2e project is affected.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: tree:0
          ref: ${{ github.head_ref }}

      - name: Setup git
        uses: ./.github/actions/setup-git

      - name: Setup node, install dependencies and configure nx
        uses: ./.github/actions/nx-setup-node

      - name: Check for affected e2e projects
        id: affected
        uses: ./.github/actions/nx-affected-projects
        with:
          target: e2e

      - name: Setup Playwright
        if: steps.affected.outputs.has-projects == 'true'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Run affected e2e tests
        if: steps.affected.outputs.has-projects == 'true'
        run: pnpm exec nx affected -t e2e

  deploy:
    needs: [build, e2e]
    uses: ./.github/workflows/cd.yml
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push') }}
    with:
      environment: development
      dry-run: ${{ github.event_name == 'pull_request' }}
      affected-only: true
      ref: ${{ needs.build.outputs.version-commit-sha }} # main only: check out the freshly-tagged commit (empty on PRs → cd.yml uses the triggering ref)
    secrets: inherit
